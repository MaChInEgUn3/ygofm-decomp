name: SLUS_014.11
sha1: 84747e64f6da8e764206ec203e489acf8c9dcf7d
options:
  basename: slus_014.11
  # All paths below are relative to base_path, which is the repo root
  # (this yaml lives in config/, so ".." walks up one level).
  base_path: ..
  target_path: extracted/SLUS_014.11
  elf_path: build/slus_014.11.elf
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  generated_asm_macros_directory: include

  ld_script_path: config/slus_014.11.ld
  ld_dependencies: True

  # The retail binary packs its sections with no inter-section padding:
  # .text starts at 0x800129D8, which is not 16-byte aligned. splat's default
  # `. = ALIGN(., 16)` after each section/segment shifted .text forward by 8
  # bytes, which showed up as every jumptable entry in .rodata pointing 8 bytes
  # too high. Both must stay False for a byte-exact link.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: False
  gp_value: 0x8009AF08

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: config/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Uncomment this line if you need to use the maspsx reorder workaround hack
  # https://github.com/mkst/maspsx?tab=readme-ov-file#include_asm-reordering-workaround-hack
  # include_asm_macro_style: maspsx_hack
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x63698   # .sbss (1048) + .bss (406144) runtime-only gap between .sdata and the trailing region below
    subsegments:
      - [0x800, rodata]      # .rdata   80010000-800129d7 (10712 bytes)
      - [0x31D8, c]          # .text    800129d8-800906df (515336 bytes) -- our ~1794 game functions live here
      - [0x80EE0, data]      # .data    800906e0-8009af07 (43048 bytes)
      - [0x8B708, data]      # .sdata   8009af08-8009b08f (392 bytes), gp-relative small data
      # .sbss/.bss (8009b090-800fe727) consume no file bytes -- handled by bss_size above.

  - name: carddata
    type: data
    start: 0x8B890
    vram: 0x800fe728       # explicit override: file content resumes here but vram jumps past the bss gap
    # 1331056 bytes, 9.7% non-zero -- mostly reserved space. NOT code: measured
    # 0 `jr $ra` and 0 stack prologues across the whole segment.
    # The dense content is three blocks near the END of the file, not the middle:
    #   vram 8020f728-80211728    8 KB  68% non-zero
    #   vram 80213728-80230728  116 KB  87% non-zero   <- the bulk
    #   vram 80237728-8023c728   20 KB  88% non-zero
    # An earlier revision of this comment put a single ~188KB block at vram
    # 801ab728-801d9728. That is wrong and was never measured: 801ab728 has ONE
    # non-zero byte in the next 188 KB. The density figure it quoted (85-90%)
    # was right, the address was off by 0x68000. Re-derive with
    # `.venv/bin/python tools_src/disc.py` and the block scan in docs/DISC.txt.
    # Whether the 116 KB block is the card database (722 cards) is still a
    # guess -- nothing has been decoded out of it.
    # DataCrystal's documented fusion-table address (0x8017C2D8) falls in this
    # segment and is all-zero on disc -- a runtime-computed cache, not shipped
    # data. So is 0x80168000, which the game nonetheless `jal`s into; see
    # docs/DISC.txt.

  - [0x1D0800]
