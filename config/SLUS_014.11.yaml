segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x63698   # .sbss (1048) + .bss (406144) runtime-only gap between .sdata and the trailing region below
    subsegments:
      - [0x800, rodata]      # .rdata   80010000-800129d7 (10712 bytes)
      - [0x31D8, c]          # .text    800129d8-800906df (515336 bytes) -- our 1336 game functions live here
      - [0x80EE0, data]      # .data    800906e0-8009af07 (43048 bytes)
      - [0x8B708, data]      # .sdata   8009af08-8009b08f (392 bytes), gp-relative small data
      # .sbss/.bss (8009b090-800fe727) consume no file bytes -- handled by bss_size above.

  - name: carddata
    type: data
    start: 0x8B890
    vram: 0x800fe728       # explicit override: file content resumes here but vram jumps past the bss gap
    # 923864 bytes, mostly zero padding/reserved space -- NOT code, do not disassemble as .text.
    # Contains one dense (~85-90% non-zero) ~188KB block around vram 801ab728-801d9728,
    # very likely the card database (722 cards). Investigate as data, not functions.
    # DataCrystal's documented fusion-table address (0x8017C2D8) falls in this range
    # and is all-zero on disc -- it's a runtime-computed cache, not shipped data.

  - [0x1D0800]
